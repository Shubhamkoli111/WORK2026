<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shubham's Portfolio Website</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+NZ:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="logo">Shubham's Portfolio</div>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Services</li>
        <li>Contact</li>
      </ul>
    </nav>

    <main>
      <section class="hero">
        <div class="hero-left">
          <div class="one">Welcome to my world</div>
          <div class="two">
            I am a <span class="bold">&lt;Devloper/&gt;</span>
          </div>

          <div class="button-container">
            <button class="btn">Contact me</button>
            <button class="btn">Services</button>
          </div>
        </div>
        <div class="hero-right">
          <img src="developerImage.jpg" alt="Shubh, The Developer" />
        </div>
      </section>

      <section class="project">
        <div class="project">
          <div class="project-image">
            <img
              src="https://clickmyproject.com/wp-content/uploads/2025/09/Artificial-intelligence-project-1-870x450.png"
              alt=""
            />
          </div>
          <div class="project-info">AI chatbot for household task</div>
        </div>
      </section>
    </main>
  </body>
</html>
