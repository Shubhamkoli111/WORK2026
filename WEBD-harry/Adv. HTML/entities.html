<!--

Common HTML Entities
Character       Entity Code     Description
<                   &lt;        Less than
>                   &gt;        Greater than
&                   &amp;       Ampersand
"                   &quot;      Double quote
'                   &apos;      Single quote
©                   &copy;      Copyright symbol
®                   &reg;       Registered symbol
₹                   &#8377;     Indian Rupee sign
→                   &rarr;      Right arrow 

-->
