<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox</title>
    <style>
      .container {
        width: 80vw;
        height: 70vh;
        /* padding: 6px; */
        border: 2px solid red;

        display: flex; /*horizontal by default*/
        /* flex-direction: column; */
        /* flex-direction: row; */
        /* flex-direction: row-reverse; */
        /* flex-direction: column-reverse; */

        /* justify-content: center; */
        /* justify-content: space-evenly; */
        justify-content: flex-start;
        /* justify-content: flex-end; */
        /* justify-content: space-between; */

        /* main axis and cross axis terms depends on flex direction row or column */

        /* align-items: center; */
        /* align-items: flex-end; */
        align-items: flex-start;

        /* flex-wrap: wrap; */
        /*boxes will adjust verically instead overflowing horizontally */
        /* flex-wrap: wrap-reverse; */

        gap: 20px;
      }

      /* align self - allow indivisiual items to align seperately */

      #box1 {
        /* align-self: flex-start; */
        /* when size of screen increases the size of this only increases with double speed */
        /* flex-grow: 2;  */
        flex-shrink: 2;
      }

      .box {
        height: 56px;
        width: 100px;
        /* margin: 5px; */
        border: 2px solid green;
        /* flex-grow: 1; zero by default */
        flex-shrink: 1;
        /* flex-basis: 50vw; */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
      <div class="box">Box 4</div>
      <div class="box">Box 5</div>
    </div>
  </body>
</html>
