<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors</title>
    <style>
      /* named color */
      div {
        color: red;
      }
      /* hex codes */
      div {
        color: #61eb34;
      }
      /* rgb values */
      p {
        color: rgb(100, 100, 100);
      }
      /* opacity : RGBA __4 parameters*/
      h2 {
        color: rgba(0, 255, 255, 0.5);
      }
      /* HSL(Hue,Saturation,Lightness) */
      h3{
        color: hsl(334, 92%, 39%);
      }
      /* HSLA like opacity, transperancy is the fourth parameter here */
    </style>
  </head>
  <body>
    <div>This is divvvvvv</div>
    <br /><br />
    <p>Use RGB for colors</p>
    <h2>Opacity checker boooooo!!!!</h3>
    <h3>HSL checker siuuuuuuuuuuuuuu!!!!</h3>
  </body>
</html>
